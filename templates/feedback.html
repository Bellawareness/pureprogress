<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="google" content="notranslate"/>
<title>Feedback - Learn Thyself</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
--pastel-pink:#ffd6e7;
--pastel-blue:#d6e9ff;
--pastel-lavender:#e7d6ff;
--pastel-mint:#d6ffe9;
--pastel-peach:#ffebd6;
--pastel-yellow:#fff9d6;
--bg-gradient-start:#ffeef8;
--bg-gradient-end:#e7f3ff;
--card-bg:rgba(255,255,255,0.95);
--text-primary:#374151;
--text-secondary:#6b7280;
--border-color:rgba(255,154,162,0.2);
--accent-1:#ec4899;
--accent-2:#8b5cf6;
--accent-3:#0ea5e9;
}
body{
font-family:Inter,system-ui,-apple-system,Arial,sans-serif;
margin:0;
min-height:100vh;
background:linear-gradient(135deg,var(--bg-gradient-start) 0%,var(--bg-gradient-end) 100%);
color:var(--text-primary);
}
.container{
max-width:900px;
margin:0 auto;
padding:24px;
}
.header-hero{
height:280px;
border-radius:20px;
position:relative;
overflow:hidden;
background-image:url('pinkcloud.jpg');
background-size:cover;
background-position:center;
margin-bottom:32px;
}
.header-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.08);
backdrop-filter:blur(2px);
}
.header-content{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100%;
text-align:center;
padding:0 1rem;
}
.page-title{
font-family:'Pacifico',cursive;
font-size:clamp(2rem,5vw,2.75rem);
color:#fff;
text-shadow:0 4px 12px rgba(0,0,0,0.3);
margin:0 0 8px 0;
}
.page-subtitle{
color:rgba(255,255,255,0.95);
font-size:1.125rem;
margin:0;
}
.card{
background:var(--card-bg);
border-radius:20px;
box-shadow:0 8px 32px rgba(255,182,193,0.15);
padding:32px;
margin-bottom:32px;
position:relative;
}
.card::before{
content:'';
position:absolute;
top:-8px;
left:20px;
width:16px;
height:16px;
background:radial-gradient(circle at 30% 30%,#ffd700 0%,#daa520 50%,#b8860b 100%);
border-radius:50%;
box-shadow:0 3px 8px rgba(0,0,0,0.3),inset -2px -2px 4px rgba(0,0,0,0.2),inset 2px 2px 4px rgba(255,255,255,0.3);
}
.card::after{
content:'';
position:absolute;
top:-8px;
right:20px;
width:16px;
height:16px;
background:radial-gradient(circle at 30% 30%,#ffd700 0%,#daa520 50%,#b8860b 100%);
border-radius:50%;
box-shadow:0 3px 8px rgba(0,0,0,0.3),inset -2px -2px 4px rgba(0,0,0,0.2),inset 2px 2px 4px rgba(255,255,255,0.3);
}
.section-title{
font-size:1.5rem;
font-weight:700;
margin-bottom:24px;
color:#8b5cf6;
display:flex;
align-items:center;
gap:12px;
}
.question{
margin-bottom:28px;
}
.question-label{
font-weight:600;
color:var(--text-primary);
margin-bottom:12px;
display:flex;
align-items:center;
gap:8px;
font-size:1.05rem;
}
.radio-group{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:12px;
}
.radio-option{
display:flex;
align-items:center;
gap:8px;
padding:12px 16px;
background:white;
border:2px solid #e5e7eb;
border-radius:12px;
cursor:pointer;
transition:all 0.3s ease;
flex:1;
min-width:fit-content;
}
.radio-option:hover{
border-color:#ff9aa2;
background:#fef2f4;
transform:translateY(-2px);
}
.radio-option input[type="radio"]{
width:18px;
height:18px;
cursor:pointer;
accent-color:#ff758f;
}
.radio-option input[type="radio"]:checked{
transform:scale(1.1);
}
.radio-option.selected{
border-color:#ff758f;
background:linear-gradient(135deg,#ffd6e7 0%,rgba(255,214,231,0.7) 100%);
}
textarea{
width:100%;
padding:16px;
border:2px solid #e5e7eb;
border-radius:12px;
font-size:1rem;
font-family:inherit;
resize:vertical;
min-height:100px;
transition:border-color 0.3s ease;
}
textarea:focus{
outline:none;
border-color:#ff9aa2;
}
.btn{
padding:16px 32px;
background:linear-gradient(135deg,#ff9aa2,#ff758f);
color:white;
border:none;
border-radius:12px;
font-size:1.125rem;
font-weight:600;
cursor:pointer;
transition:all 0.3s ease;
box-shadow:0 4px 12px rgba(255,117,143,0.3);
width:100%;
}
.btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 20px rgba(255,117,143,0.4);
}
.btn:active{
transform:translateY(0);
}
.back-btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:12px 24px;
background:white;
color:#6b7280;
border:2px solid #e5e7eb;
border-radius:12px;
font-weight:600;
text-decoration:none;
transition:all 0.3s ease;
margin-bottom:24px;
}
.back-btn:hover{
border-color:#ff9aa2;
color:#ff758f;
transform:translateX(-4px);
}
.success-message{
display:none;
padding:24px;
background:linear-gradient(135deg,#d1fae5 0%,rgba(209,250,229,0.7) 100%);
border-radius:16px;
border:2px solid #10b981;
text-align:center;
}
.success-message.show{
display:block;
}
@media(max-width:768px){
.radio-group{
flex-direction:column;
}
.radio-option{
flex:none;
width:100%;
}
}
</style>
</head>

<script>
// Add visual feedback for radio selection
document.querySelectorAll('.radio-option input[type="radio"]').forEach(radio => {
  radio.addEventListener('change', function() {
    // Remove selected class from all options in this group
    const groupName = this.name;
    document.querySelectorAll(`input[name="${groupName}"]`).forEach(r => {
      r.closest('.radio-option').classList.remove('selected');
    });
    // Add selected class to chosen option
    this.closest('.radio-option').classList.add('selected');
  });
});

// Handle form submission
document.getElementById('feedbackForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  // Get form data
  const formData = new FormData(this);
  
  // Submit to Formspree
  fetch(this.action, {
    method: 'POST',
    body: formData,
    headers: {
      'Accept': 'application/json'
    }
  }).then(response => {
    if (response.ok) {
      // Show success message
      document.getElementById('successMessage').classList.add('show');
      document.getElementById('feedbackForm').style.display = 'none';
      // Scroll to top
      window.scrollTo({top: 0, behavior: 'smooth'});
    } else {
      alert('Oops! There was a problem submitting your form. Please try again.');
    }
  }).catch(error => {
    alert('Oops! There was a problem submitting your form. Please try again.');
  });
});
</script>
