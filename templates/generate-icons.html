<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate App Icons</title>
</head>
<body>
  <h2>App Icon Generator for Learn Thyself</h2>
  <p>Right-click each canvas below and "Save Image As..." to create your PWA icons.</p>
  
  <div>
    <h3>icon-192.png (192x192)</h3>
    <canvas id="icon192" width="192" height="192"></canvas>
  </div>
  
  <div>
    <h3>icon-512.png (512x512)</h3>
    <canvas id="icon512" width="512" height="512"></canvas>
  </div>

  <script>
    function createIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Gradient background (pink to lavender)
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#ffd6e7');
      gradient.addColorStop(0.5, '#e7d6ff');
      gradient.addColorStop(1, '#d6e9ff');
      
      // Rounded rectangle background
      const radius = size * 0.15;
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();
      
      // Draw heart icon (representing self-love/tracking)
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      const centerX = size / 2;
      const centerY = size / 2;
      const heartSize = size * 0.35;
      
      // Left curve
      ctx.arc(centerX - heartSize * 0.25, centerY - heartSize * 0.25, heartSize * 0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Right curve
      ctx.beginPath();
      ctx.arc(centerX + heartSize * 0.25, centerY - heartSize * 0.25, heartSize * 0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Bottom triangle
      ctx.beginPath();
      ctx.moveTo(centerX - heartSize * 0.5, centerY - heartSize * 0.1);
      ctx.lineTo(centerX + heartSize * 0.5, centerY - heartSize * 0.1);
      ctx.lineTo(centerX, centerY + heartSize * 0.6);
      ctx.closePath();
      ctx.fill();
      
      // Add sparkle effect
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(centerX + heartSize * 0.4, centerY - heartSize * 0.5, size * 0.04, 0, Math.PI * 2);
      ctx.fill();
      
      // Add text
      ctx.fillStyle = '#8b5cf6';
      ctx.font = `bold ${size * 0.12}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('Learn', centerX, size * 0.88);
      ctx.fillText('Thyself', centerX, size * 0.96);
    }

    // Generate both icons
    createIcon('icon192', 192);
    createIcon('icon512', 512);
  </script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f3f4f6;
    }
    canvas {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      margin: 10px 0;
      background: white;
    }
    div {
      margin: 30px 0;
    }
  </style>
</body>
</html>
